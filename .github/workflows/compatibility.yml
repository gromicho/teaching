name: Check latest compatible dependencies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pyomo highspy pandas numpy sympy scipy matplotlib networkx scikit-learn openpyxl nbformat nbclient ipykernel
      # Do not run pinned setup cells in the latest-version experiment.
      - run: python scripts/check_resources.py --execute --report compatibility-report.json
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-report
          path: compatibility-report.json
