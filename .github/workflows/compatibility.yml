name: Check latest compatible dependencies
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compatibility.yml'
permissions:
  contents: read
jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pyomo highspy pandas numpy sympy scipy matplotlib networkx scikit-learn openpyxl seaborn cvxpy imageio swiglpk nbformat nbclient ipykernel
      # Keep bootstrap imports and deliberately staged installations executable.
      - run: python scripts/check_integrity.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_links.py --report compatibility-links.json
      - run: python scripts/check_resources.py --execute --run-setup --report compatibility-report.json
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-report
          path: |
            compatibility-report.json
            compatibility-links.json
