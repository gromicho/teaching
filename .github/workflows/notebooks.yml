name: Teaching checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  covid-pandas3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The live-network notebook is excluded from routine full execution.
      # Check its aggregation offline on pandas 3 as well as the profiles below.
      - run: python -m pip install 'pandas>=3,<4'
      - run: python -m unittest discover -s tests -p test_covid_descriptive.py -v
      - run: python -m pip check
  fruit-pandas3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Exercise both full lessons on pandas 3, including the correction and plots.
      - run: python -m pip install 'pandas>=3,<4' 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'seaborn>=0.13,<1' 'matplotlib>=3.7,<4' nbformat nbclient ipykernel
      - run: python -m unittest discover -s tests -p test_fruit_lessons.py -v
      - run: >-
          python scripts/check_resources.py --execute --run-setup
          --notebook courses/abw/notebooks/lecture-3/fruit-data-exploration.ipynb
          --notebook courses/abw/notebooks/lecture-4/accuracy-entropy-and-clustering.ipynb
          --report fruit-pandas3-report.json
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fruit-pandas3
          path: fruit-pandas3-report.json
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, colab]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: matrix.profile == 'baseline'
        run: python -m pip install -r requirements-test.txt
      - if: matrix.profile == 'colab'
        run: python -m pip install -r requirements-colab-test.txt
      - run: python scripts/check_integrity.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_links.py --report link-report.json
      - run: python scripts/check_resources.py --execute --run-setup --report validation-report.json
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.profile }}
          path: '*-report.json'
