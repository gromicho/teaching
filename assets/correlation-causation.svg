<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title description">
  <title id="title">Correlation can result from a common cause</title>
  <desc id="description">Hot, dry, sunny summer weather increases both ice-cream demand and sunburn incidence. The two outcomes are correlated, but neither causes the other.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .node-title { font-size: 24px; font-weight: 700; }
      .node-subtitle { font-size: 18px; }
      .edge-label { font-size: 18px; font-weight: 700; }
      .note { font-size: 20px; }
    </style>
  </defs>

  <rect width="900" height="480" rx="24" fill="#ffffff"/>

  <rect x="42" y="142" width="340" height="142" rx="20" fill="#fff4cc" stroke="#d97706" stroke-width="3"/>
  <circle cx="94" cy="191" r="28" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <g stroke="#d97706" stroke-width="4">
    <line x1="94" y1="155" x2="94" y2="145"/>
    <line x1="94" y1="227" x2="94" y2="237"/>
    <line x1="61" y1="191" x2="51" y2="191"/>
    <line x1="127" y1="191" x2="137" y2="191"/>
    <line x1="73" y1="170" x2="62" y2="159"/>
    <line x1="115" y1="212" x2="126" y2="223"/>
    <line x1="73" y1="212" x2="62" y2="223"/>
    <line x1="115" y1="170" x2="126" y2="159"/>
  </g>
  <text class="label node-title" x="167" y="184">Hot, dry, sunny</text>
  <text class="label node-title" x="167" y="215">summer weather</text>
  <text class="label node-subtitle" x="167" y="249">common cause</text>

  <rect x="606" y="54" width="250" height="118" rx="20" fill="#e8f1ff" stroke="#2563eb" stroke-width="3"/>
  <text class="label node-title" x="731" y="102" text-anchor="middle">Ice-cream</text>
  <text class="label node-title" x="731" y="134" text-anchor="middle">demand</text>

  <rect x="606" y="254" width="250" height="118" rx="20" fill="#ffe9e7" stroke="#dc2626" stroke-width="3"/>
  <text class="label node-title" x="731" y="303" text-anchor="middle">Sunburn</text>
  <text class="label node-title" x="731" y="335" text-anchor="middle">incidence</text>

  <path d="M382 178 C450 132, 520 105, 594 111" fill="none" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="label edge-label" x="482" y="92" text-anchor="middle">causal influence</text>

  <path d="M382 249 C450 294, 520 316, 594 314" fill="none" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="label edge-label" x="482" y="344" text-anchor="middle">causal influence</text>

  <line x1="731" y1="185" x2="731" y2="241" stroke="#6b7280" stroke-width="4" stroke-dasharray="8 7"/>
  <path d="M722 194 L731 180 L740 194" fill="none" stroke="#6b7280" stroke-width="4"/>
  <path d="M722 232 L731 246 L740 232" fill="none" stroke="#6b7280" stroke-width="4"/>
  <text class="label edge-label" x="748" y="211">observed</text>
  <text class="label edge-label" x="748" y="233">correlation</text>

  <rect x="48" y="402" width="804" height="62" rx="14" fill="#f3f4f6"/>
  <text class="label note" x="450" y="427" text-anchor="middle">A common cause can make two outcomes move together</text>
  <text class="label note" x="450" y="452" text-anchor="middle">without either causing the other.</text>
</svg>
